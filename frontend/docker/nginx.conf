# Phục vụ SPA + reverse proxy sang backend (docs/08-devops.md §4).
#
# Trình duyệt chỉ nói chuyện với nginx, cùng một origin cho cả trang và API — không cần CORS và backend
# không publish cổng ra ngoài.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Import Excel + avatar. Backend tự chặn theo MAX_UPLOAD_MB; ở đây chỉ là trần an toàn.
    client_max_body_size 10m;

    # Tên `backend` phân giải lúc có request (DNS nội bộ của Docker), không phải lúc nginx khởi động:
    # backend khởi động lại và đổi IP thì nginx không trỏ vào địa chỉ cũ, và nginx vẫn lên được khi
    # backend chưa sẵn sàng.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Đặt ở cấp server và KHÔNG dùng add_header trong location — add_header trong location xoá hết
    # header kế thừa từ server. Cache của từng loại file dùng `expires` (không phải add_header).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    # text/event-stream cố ý KHÔNG có ở đây: nén là gom byte lại chờ đủ khối, SSE sẽ đứng.
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr chứ KHÔNG phải $proxy_add_x_forwarded_for: biến đó nối thêm vào chuỗi
        # client tự gửi, nên bất kỳ ai cũng chèn được IP giả vào đầu header — đủ để qua mặt
        # rate limit đăng nhập và làm bẩn audit log. Chỉ có một proxy nên không cần giữ chuỗi.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # BẮT BUỘC cho SSE sơ đồ Gala (CLAUDE.md cạm bẫy #2): không gom response lại rồi mới gửi.
        proxy_buffering off;
        proxy_cache off;
        # Luồng SSE sống lâu; ping 15 giây/lần nên timeout mặc định 60 giây vẫn qua, để dư cho mạng chậm.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Avatar CBNV do backend phục vụ từ volume dữ liệu.
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1h;
    }

    # File build có hash trong tên: cache lâu thoải mái.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # SPA: mọi đường dẫn khác trả index.html để React Router xử lý. index.html không cache, để bản
    # deploy mới có hiệu lực ngay.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
