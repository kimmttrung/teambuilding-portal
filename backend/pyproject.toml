[project]
name = "teambuilding-portal-backend"
version = "0.1.0"
description = "Backend cho hệ thống quản lý Team Building"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends() trong tham số mặc định là chuẩn của FastAPI
